<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Upload a PDF resume for evidence-based matching against the EDVISORY AI & Data Solution Intern position."
    >
    <title>AI Resume Matcher</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=Space+Grotesk:wght@600;700&amp;display=swap"
    >
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <section class="matcher-card" aria-labelledby="page-title">
        <header class="hero">
          <p class="product-label">AI Resume Matcher</p>
          <h1 id="page-title">Upload your resume</h1>
          <p class="intro">
            Analyze your resume against the EDVISORY AI &amp; Data Solution
            Intern position
          </p>
        </header>

        <div class="upload-panel">
          <div
            class="drop-zone"
            id="drop-zone"
            role="button"
            tabindex="0"
            aria-label="Select or drop a PDF resume"
            aria-describedby="file-requirements upload-status"
          >
            <span class="upload-illustration" aria-hidden="true">
              <svg viewBox="0 0 96 96" focusable="false">
                <path
                  class="folder-tab"
                  d="M18 36v-4a6 6 0 0 1 6-6h18l7 8h23a6 6 0 0 1 6 6v4"
                ></path>
                <path
                  class="folder-body"
                  d="M18 40h60v29a7 7 0 0 1-7 7H25a7 7 0 0 1-7-7z"
                ></path>
                <circle class="upload-badge" cx="68" cy="66" r="14"></circle>
                <path class="upload-arrow" d="M68 72V60m0 0-5 5m5-5 5 5"></path>
              </svg>
            </span>
            <p class="drop-title">
              Drag &amp; drop your resume here or <span>choose file</span>
            </p>

            <label class="visually-hidden" for="resume-file">
              Select a PDF resume
            </label>
            <input
              class="visually-hidden"
              id="resume-file"
              name="resume"
              type="file"
              accept="application/pdf,.pdf"
              tabindex="-1"
            >

            <p class="requirements" id="file-requirements">
              PDF only <span aria-hidden="true">•</span> Max 10 MiB
              <span aria-hidden="true">•</span> Up to 10 pages
            </p>
          </div>

          <div class="file-summary" id="file-summary" hidden>
            <div class="file-details">
              <svg
                class="selected-file-icon"
                viewBox="0 0 48 48"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  d="M10 3h17l11 11v24a7 7 0 0 1-7 7H10a7 7 0 0 1-7-7V10a7 7 0 0 1 7-7Z"
                  fill="#e34f4f"
                ></path>
                <path
                  d="M27 3v8a4 4 0 0 0 4 4h7L27 3Z"
                  fill="#f58a8a"
                ></path>
                <text
                  x="24"
                  y="31"
                  text-anchor="middle"
                  fill="white"
                  font-size="10"
                  font-weight="700"
                  font-family="Inter, Arial, sans-serif"
                >PDF</text>
              </svg>
              <span>
                <strong id="file-name"></strong>
                <small id="file-size"></small>
              </span>
            </div>
            <button class="remove-button" id="remove-file" type="button">
              Remove
            </button>
          </div>

          <p class="status-message" id="upload-status" aria-live="polite"></p>

          <button class="analyze-button" id="analyze-button" type="button" disabled>
            Analyze Resume
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
